# Fly.io — deploy with: fly launch --no-deploy && fly deploy
# Set secrets first:
#   fly secrets set GOOGLE_API_KEY=... AUTH_USERNAME=... AUTH_PASSWORD_HASH=... \
#                   SECRET_KEY=... EMAIL_FROM=... SMTP_USER=... SMTP_PASSWORD=...
app = "taseers-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_FORMAT = "json"
  PORT = "8000"
  DATABASE_URL = "sqlite:///data/multi_agent.db"
  OUTPUT_DIR = "data/output"
  UPLOAD_DIR = "data/uploads"
  AUTH_ENABLED = "true"
  COOKIE_SECURE = "true"
  EMAIL_ENABLED = "true"
  EMAIL_PROVIDER = "smtp"
  SMTP_HOST = "smtp.gmail.com"
  SMTP_PORT = "465"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep sessions alive between requests
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true            # do not buffer the SSE stream

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"

# Sessions and SQLite are per-process: one machine, or move both to shared stores.
[[mounts]]
  source = "data"
  destination = "/app/data"
