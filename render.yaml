# Render blueprint — FREE tier.
# Runs the Docker image (React SPA + FastAPI) on Render's free web service.
# Data lives in a free managed Postgres (Neon/Supabase), NOT on a Render disk —
# so there is no disk cost and nothing is lost when a free instance sleeps.
#
# You MUST set DATABASE_URL to your Neon connection string (Render will prompt
# for it below, along with the other secrets). Without it the app would fall
# back to an ephemeral SQLite file that resets on restart.
services:
  - type: web
    name: taseers-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free             # $0 — free instances sleep after ~15 min idle
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      # --- database: paste your Neon postgres:// URL when prompted ---
      - key: DATABASE_URL
        sync: false        # e.g. postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - key: GOOGLE_API_KEY
        sync: false
      # --- auth (required in production) ---
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_ALLOW_SIGNUP
        value: "true"      # new users can register from anywhere
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false        # python -m multi_agent_system.auth
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # --- email (optional) ---
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
