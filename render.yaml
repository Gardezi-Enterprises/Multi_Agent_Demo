# Render blueprint — https://render.com/docs/blueprint-spec
# Builds the multi-stage Dockerfile (React SPA + FastAPI) into one service.
services:
  - type: web
    name: taseers-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 512 MB; free instances sleep and lose session state
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        value: sqlite:///data/multi_agent.db
      - key: OUTPUT_DIR
        value: data/output
      - key: UPLOAD_DIR
        value: data/uploads
      - key: GOOGLE_API_KEY
        sync: false        # set in the dashboard, never in git
      # --- auth (required in production) ---
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false        # python -m multi_agent_system.auth
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Open self-service signup so new users anywhere can register.
      # Optionally gate it with a shared code by setting AUTH_SIGNUP_CODE.
      - key: AUTH_ALLOW_SIGNUP
        value: "true"
      # --- email ---
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
    disk:
      name: data           # SQLite + generated documents survive restarts
      mountPath: /app/data
      sizeGB: 1
